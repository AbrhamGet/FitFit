<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>FitFit</title>
  <meta name="theme-color" content="#FFF6E5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FitFit">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <main id="view"></main>
    <nav id="tabs">
      <button data-tab="today" class="tab"><span>🏠</span>Today</button>
      <button data-tab="food" class="tab"><span>🍽️</span>Food</button>
      <button data-tab="walk" class="tab"><span>🚶</span>Walk</button>
      <button data-tab="progress" class="tab"><span>📈</span>Progress</button>
      <button data-tab="me" class="tab"><span>⚙️</span>Me</button>
    </nav>
  </div>
  <div id="sheet-bg" hidden></div>
  <div id="sheet" hidden></div>
  <div id="toast" hidden></div>
  <canvas id="confetti"></canvas>
  <script src="foods.js"></script>
  <script src="app.js"></script>
</body>
</html>
